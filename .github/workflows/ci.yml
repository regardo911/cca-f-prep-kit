name: tests

on: [push, pull_request]

jobs:
  keyless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The two the tests actually import. No claude-agent-sdk, no anthropic:
      # nothing in CI calls Claude, and there is no ANTHROPIC_API_KEY here.
      - name: Install what the offline tests import
        run: pip install pydantic pyyaml

      - name: Scoring and the shuffle round-trip
        run: python3 tests/test_score_mock.py

      - name: MCP portability assertions
        run: python3 tests/test_portability.py

      - name: Pydantic models and the operator policy
        run: python3 tests/test_models_and_policy.py

      - name: Links, images and the nesting hazard
        run: python3 tests/test_links.py

      # Fails the build if the loop above ever runs zero checks.
      - name: All of them, with the count asserted non-zero
        run: python3 tests/run_all.py
